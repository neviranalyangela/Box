# CI workflow for the Box fork (neviranalyangela/Box), pushed as
# .github/workflows/android.yml on branch mix-android10.
# Upstream jegly/Box has NO CI at all, so this is new.
# Runners are x86_64 with a real NDK: the native libs (llama.cpp,
# whisper.cpp, smollm) build here. ampere-2 (aarch64 host) cannot
# build them — Hermes's local build is a sanity check only.
#
# History:
# - run 44010056209: android-actions/setup-android@v3 FAILED — its bundled
#   cmdline-tools 16.0 runs `sdkmanager --licenses`, which prompts (y/N)?
#   on a non-interactive runner and exits 1. The action was dropped.
# - run 44010529093: `yes | sdkmanager "platforms;android-37" ...` FAILED —
#   "Failed to find package 'platforms;android-37'". The platform IS real
#   (ampere-2 SDK has android-37, IsBaseSdk=true, PreviewSdkInt=0), so the
#   runner's repository index just doesn't list it (stale cache). The
#   ubuntu-latest image usually preinstalls the current platform, so the
#   install step below is best-effort per package: install only what is
#   missing, warn instead of failing — the Gradle build is the real gate
#   and fails clearly if the platform is truly absent.
name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install NDK + platform 37 (best effort)
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          echo "Installed packages:"
          "$MGR" --list_installed 2>/dev/null | grep -E "platforms;android-3|build-tools;3|ndk;" || true
          for pkg in "platforms;android-37" "build-tools;37.0.0" "ndk;27.2.12479018"; do
            if "$MGR" --list_installed 2>/dev/null | grep -qF "$pkg"; then
              echo "$pkg already installed"
            else
              echo "Installing $pkg ..."
              yes | "$MGR" "$pkg" || echo "WARNING: could not install $pkg (build will tell if it matters)"
            fi
          done

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: box-debug-r${{ github.run_number }}
          path: Android/src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
