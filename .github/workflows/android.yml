# Draft CI workflow for the Box fork (neviranalyangela/Box).
# To be pushed as .github/workflows/android.yml together with the
# mix-android10 branch (workflow files need the PAT push — same as
# litert-gallery). Upstream jegly/Box has NO CI at all, so this is new.
# Runners are x86_64 with a real NDK: the native libs (llama.cpp,
# whisper.cpp, smollm) build here. ampere-2 (aarch64 host) cannot
# build them — Hermes's local build is a sanity check only.
name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: box-debug-r${{ github.run_number }}
          path: Android/src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
